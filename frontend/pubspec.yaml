name: surfpos_ai
description: "SurfPOS AI — AI-powered mobile-first cloud POS for small retailers. See docs/01_PROJECT_OVERVIEW.md."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

# Design-system + UI-shell dependencies only (see docs/09_PROMPT_HISTORY.md for
# when these were added). Data-layer dependencies (Riverpod, go_router, dio,
# firebase_auth, firebase_database, firebase_storage, camera/barcode scanning,
# etc.) are added when those layers are implemented — see
# docs/08_ARCHITECTURE_DECISIONS.md and docs/10_TASKS.md.

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.0
  lucide_icons_flutter: ^3.1.15
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

