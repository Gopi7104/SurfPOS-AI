org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Works around a JDK/Gradle TLS 1.3 session-resumption bug on this machine
# that corrupts concurrent artifact downloads from Maven Central
# ("bad_record_mac" / "Tag mismatch") — plain curl against the same URL
# succeeds cleanly, so this is Gradle's downloader, not a real network
# problem. Forcing TLS 1.2 avoids the buggy code path.
systemProp.https.protocols=TLSv1.2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
