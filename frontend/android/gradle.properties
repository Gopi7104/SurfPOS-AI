org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Works around a JDK/Gradle TLS session-resumption bug on this machine that
# corrupts concurrent artifact downloads from Maven Central/dl.google.com
# ("bad_record_mac" / "Tag mismatch") — plain curl against the same URL
# succeeds cleanly, so this is Gradle's downloader, not a real network
# problem. Forcing TLS 1.2 alone wasn't enough once a plugin (app_links) adds
# a second, concurrent classpath resolution (its own legacy `buildscript{}`
# block resolving a different AGP version than the root project) — disabling
# parallel project execution serializes downloads and avoids the race.
systemProp.https.protocols=TLSv1.2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
