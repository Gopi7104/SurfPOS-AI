# Render Blueprint — deploys the backend API as a single web service.
# See DEPLOYMENT.md for the full deployment walkthrough and PRODUCTION_ENV.md for what each
# env var below actually needs to contain.
#
# `sync: false` vars are secrets — Render prompts for them once in the dashboard and never stores
# the value in this file. Everything else has a safe committed default.
#
# autoDeploy is off on purpose: review a build in the Render dashboard and deploy it manually
# until you're ready to switch this to `yes`.

services:
  - type: web
    name: surfpos-ai-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: DEFAULT_MODEL
        value: openai/gpt-5-mini
      - key: OCR_PROVIDER_API_KEY
        sync: false

      - key: SURFBOARD_API_KEY
        sync: false
      - key: SURFBOARD_API_SECRET
        sync: false
      - key: SURFBOARD_WEBHOOK_SECRET
        sync: false
      - key: SURFBOARD_ENV
        value: production
      - key: SURFBOARD_AUTH_STRATEGY
        value: api_key_secret
      - key: SURFBOARD_BEARER_TOKEN
        sync: false
      - key: SURFBOARD_PARTNER_ID
        sync: false
      - key: SURFBOARD_API_URL
        sync: false
      - key: SURFBOARD_SECRET_KEY
        sync: false
      - key: SURFBOARD_ONLINE_STORE_WEBSHOP_URL
        sync: false
      - key: SURFBOARD_ONLINE_STORE_TERMS_URL
        sync: false
      - key: SURFBOARD_ONLINE_STORE_PRIVACY_URL
        sync: false
